name: CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Typecheck examples and TypeScript 5 configuration
        run: |
          yarn workspace DropShadowLegacy typecheck
          yarn workspace DropShadowModern typecheck
          yarn workspace DropShadowLegacy tsc --project ../../tsconfig.json --noEmit
          yarn workspace DropShadowLegacy tsc --project ../../tsconfig.build.json --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package and typecheck Web host
        run: |
          yarn prepare
          yarn workspace DropShadowWeb typecheck
          yarn workspace DropShadowWeb build

      - name: Install Chromium
        run: yarn workspace DropShadowWeb playwright install --with-deps chromium

      - name: Verify packed entries, SSR and browser rendering
        run: yarn workspace DropShadowWeb test

  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android-dir: [examples/legacy/android, examples/modern/android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        working-directory: ${{ matrix.android-dir }}
        run: bash ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Test native shadow property updates
        working-directory: ${{ matrix.android-dir }}
        run: bash ./gradlew :react-native-drop-shadow:testDebugUnitTest --tests com.dropshadow.DropShadowLayoutTest --no-daemon --console=plain

      - name: Build release with R8 and resource shrinking
        working-directory: ${{ matrix.android-dir }}
        run: bash ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install cocoapods
        working-directory: examples/modern/ios
        run: |
          pod install

      - name: Build example for iOS
        working-directory: examples/modern/ios
        run: |
          xcodebuild \
            -workspace DropShadowModern.xcworkspace \
            -scheme DropShadowModern \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
